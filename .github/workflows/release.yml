name: Release

# Publishes a GitHub release with Android, Windows, Linux and Web builds.
# Start it by pushing a tag like v0.2.0, or run it by hand with a version
# (that creates the tag on the chosen commit).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (no "v")
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  build:
    needs: [version, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: build/release

      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md
            echo
            echo "### Downloads"
            echo "| File | Platform |"
            echo "|---|---|"
            echo "| \`PassThePlate-$VERSION-android.apk\` | Android phones and tablets (Android 7+) |"
            echo "| \`PassThePlate-$VERSION-windows.zip\` | Windows 10/11, 64-bit |"
            echo "| \`PassThePlate-$VERSION-linux.tar.gz\` | Linux, 64-bit |"
            echo "| \`PassThePlate-$VERSION-web.zip\` | Web build (serve the folder over HTTP) |"
            echo
            echo "Installing the APK: allow \"install unknown apps\" for your browser or file manager, then open the file."
            echo "Test builds are signed with a shared test key; if Android refuses an update, uninstall the old version first."
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pass the Plate! v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: build/release/*
          fail_on_unmatched_files: true
