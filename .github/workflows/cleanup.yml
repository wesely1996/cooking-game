name: Clean up old builds

# Deletes workflow artifacts (dev builds, screenshots) older than 7 days, so
# they don't fill up the repository's storage. New uploads already expire
# after 7 days; this also catches older ones. Files attached to GitHub
# releases are not artifacts and are never touched.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete artifacts older than 7 days
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting artifacts created before $cutoff"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | \"\\(.id) \\(.name) \\(.created_at)\"" \
            > old.txt
          count=0
          while read -r id name created; do
            echo "  $name ($created)"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            count=$((count + 1))
          done < old.txt
          echo "Deleted $count artifact(s)."
